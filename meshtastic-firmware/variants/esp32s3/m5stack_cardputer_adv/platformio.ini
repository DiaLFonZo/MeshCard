; M5stack Cardputer Advanced
[env:m5stack-cardputer-adv]
extends = esp32s3_base
board_level = release
board = m5stack-stamps3
board_build.partitions = default_8MB.csv
upload_protocol = esptool
build_flags = 
  ${esp32s3_base.build_flags}
  -D M5STACK_CARDPUTER_ADV
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -I variants/esp32s3/m5stack_cardputer_adv
  -DOLEDDISPLAY_REDUCE_MEMORY
lib_deps =
  ${esp32s3_base.lib_deps}
  # renovate: datasource=git-refs depName=meshtastic-st7789 packageName=https://github.com/meshtastic/st7789 gitBranch=main
  https://github.com/meshtastic/st7789/archive/92bae2e4a307afb430c3b0bc3d661c55ee1565f0.zip
  # renovate: datasource=github-tags depName=pschatzmann_arduino-audio-driver packageName=pschatzmann/arduino-audio-driver
  https://github.com/pschatzmann/arduino-audio-driver/archive/v0.3.1.zip
  # renovate: datasource=git-refs depName=ESP8266Audio packageName=https://github.com/meshtastic/ESP8266Audio gitBranch=meshtastic-2.0.0-dacfix
  https://github.com/meshtastic/ESP8266Audio/archive/343024632ee78d6216907b2353fc943a62422d80.zip
  # renovate: datasource=custom.pio depName=ESP8266SAM packageName=earlephilhower/library/ESP8266SAM
  earlephilhower/ESP8266SAM@1.1.0

; MeshCard: Cardputer ADV with an M5Stack U115 on the Grove port as the radio
[env:m5stack-cardputer-adv-u115]
extends = env:m5stack-cardputer-adv
board_level = extra
build_flags =
  ${env:m5stack-cardputer-adv.build_flags}
  -D U115_BRIDGE_ESP32

; MeshCard: the U115 build with the MeshCard screens (LVGL) instead of the stock screen.
; The MeshCard sources come from ../meshcard (next to this firmware folder).
[env:m5stack-cardputer-adv-meshcard]
extends = env:m5stack-cardputer-adv-u115
board_level = extra
build_flags =
  ${env:m5stack-cardputer-adv-u115.build_flags}
  -D MESHCARD_UI
  -D MESHCARD_ESP32
  ; No PSRAM: fewer remembered nodes leaves room for the screens and Bluetooth together.
  -D MAX_NUM_NODES=80
  -D MAX_RX_TOPHONE=12
  -D MAX_MQTT_PROXY_MESSAGES=4
  -D MC_SCREEN_W=240
  -D MC_SCREEN_H=135
  -D MESHZERO_VERSION=\"adv\"
  -D LV_CONF_INCLUDE_SIMPLE
  -I variants/esp32s3/m5stack_cardputer_adv/meshcard
lib_deps =
  ${env:m5stack-cardputer-adv-u115.lib_deps}
  # renovate: datasource=github-tags depName=lvgl packageName=lvgl/lvgl
  https://github.com/lvgl/lvgl/archive/refs/tags/v9.3.0.zip
  meshcard-ui=symlink://../meshcard
