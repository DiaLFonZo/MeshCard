# meshtasticd with the Meshtastic UI (device-ui, 320x240 landscape) on the Cardputer Zero.
# The UI is drawn at 320x240 and shrunk onto the 320x170 LCD (/dev/fb0).
# Radio: the U115 on the Grove port, same as MeshZero's radio.yaml.
---
Lora:
  Module: sx1262
  spidev: ch341
  CS: 0
  Reset: 2
  Busy: 4
  IRQ: 6
  DIO2_AS_RF_SWITCH: true

Display:
  Panel: FB
  Width: 320
  Height: 240

Input:
  KeyboardDevice: /dev/input/by-path/platform-3f804000.i2c-event

Logging:
  LogLevel: info

General:
  MaxNodes: 200
  MaxMessageQueue: 100
