# MeshZero service settings, U115 version. Restart to apply:
#   sudo systemctl restart meshzero

MESHZERO_API_BIND=0.0.0.0
MESHZERO_API_PORT=4403
MESHZERO_RADIO_PORT=4404

# U115 on the Grove port instead of the Cap LoRa-1262:
# - power comes from the Grove 5 V switch
# - no cap detection, and no I2C at all (the Cap's IO expander does not exist here)
# - run our U115 build of meshtasticd (/usr/bin/meshtasticd -> /usr/local/bin/meshtasticd)
MESHZERO_5V_PATH=/sys/class/leds/grove_5v_out/brightness
MESHZERO_CAP_DETECT=0
MESHZERO_I2C_DEV=/dev/meshzero-no-i2c
MESHZERO_GPS_DEV=/dev/meshzero-no-gps
MESHZERO_USE_SYSTEM_MESHTASTICD=1
